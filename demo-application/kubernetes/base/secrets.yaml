apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-west-2
      # Pod Identity injects credentials natively into the ESO pod
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rds-credentials
  namespace: demo-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: db-credentials-secret # This will be created as a standard K8s Secret
    creationPolicy: Owner
  data:
    - secretKey: DB_HOST
      remoteRef:
        key: 8byte-dev-db-creds
        property: host
    - secretKey: DB_PORT
      remoteRef:
        key: 8byte-dev-db-creds
        property: port
    - secretKey: DB_USER
      remoteRef:
        key: 8byte-dev-db-creds
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: 8byte-dev-db-creds
        property: password
    - secretKey: DB_NAME
      remoteRef:
        key: 8byte-dev-db-creds
        property: dbname
