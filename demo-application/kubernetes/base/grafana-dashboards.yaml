apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-grafana-dashboard
  namespace: demo-app
  labels:
    grafana_dashboard: "1"
data:
  backend-dashboard.json: |-
    {
      "title": "Backend Application Metrics",
      "panels": [
        {
          "title": "Total HTTP Requests",
          "type": "stat",
          "targets": [
            {
              "expr": "sum(http_requests_total)",
              "refId": "A"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          }
        },
        {
          "title": "Orders Created",
          "type": "stat",
          "targets": [
            {
              "expr": "sum(orders_created_total)",
              "refId": "A"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          }
        }
      ],
      "schemaVersion": 30
    }
